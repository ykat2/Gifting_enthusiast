<!DOCTYPE html>
<html>
    <head>
        <title>Gift Love</title>
        <link rel="stylesheet" href="Styling-Sheet.css">
    </head>
    <body>
        <img class="logo-homePage" src="logo.png" alt="logo-pic">
         <!--dont forget logo map-->


        <a href="SignInPage.html" class="go-to-signIn-button">Sign In</a>
        <a href="LogInPage.html" class="go-to-Login-button">Log In</a>


        <!--gift boxes part-->
        <section class="gifts-section">


        <article class="gift-card">
        <img src="graduation-box.jpg" alt="Graduation gift box">
        <h2>Graduation Gift</h2>
        <h3>Customize your gift</h3>
        <ul class="gift-options">
            <li> <label> <input type="checkbox" name="graduation" value="mirror"> Mirror with the Graduate’s Name </label> </li>
           <li> <label> <input type="checkbox" name="graduation" value="Keychain"> Graduation Year Keychain </label> </li>
        <li> <label> <input type="checkbox" name="graduation" value="Sash"> Mini Graduation Sash with Year </label> </li>
        </ul>
        <button type="button" class="add-to-cart-button">Add to Cart</button>
        </article>

      <article class="gift-card">
        <img src="birthday-box.jpg" alt="Birthday gift box">
        <h2>Birthday Gift</h2>
        <h3>Customize your gift</h3>
        <ul class="gift-options">
            <li> <label> <input type="checkbox" name="birthday" value="candle"> Scented Candle </label> </li>
           <li> <label> <input type="checkbox" name="birthday" value="perfume">Mini Perfume </label> </li>
        <li> <label> <input type="checkbox" name="birthday" value="necklace"> Necklace </label> </li>
        </ul>
        <button type="button" class="add-to-cart-button">Add to Cart</button>
        </article>

         <article class="gift-card">
        <img src="newborn-box.jpg" alt="Birthday gift box">
        <h2>Newborn Gift</h2>
        <h3>Customize your gift</h3>
        <ul class="gift-options">
            <li> <label> <input type="checkbox" name="birthday" value="bear"> Mini Teddy Bear </label> </li>
           <li> <label> <input type="checkbox" name="birthday" value="outfit">Newborn Outfit </label> </li>
        <li> <label> <input type="checkbox" name="birthday" value="blanket">Soft Baby Blanket </label> </li>
        </ul>
       <button type="button" class="add-to-cart-button">Add to Cart</button>
        </article>


        </section>



    </body>
</html>
