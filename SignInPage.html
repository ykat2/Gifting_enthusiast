<html>
    <head>
        <title>Gift Love</title>
        <link rel="stylesheet" href="Styling-Sheet.css">
    </head>
    <body>
        <img class="logo-pic" src="logo.png" alt="logo picture">
        <form>
        <label>Enter Your Name: </label><br>
        <input type="text" name="name" size="30" maxlength="50" placeholder="your name..."><br>

        <label>Enter Your Email: </label><br>
        <input type="email" name="email" placeholder="your email..."><br>

        <label>Enter Your Phone Number: </label><br>
        <input type="tel" name="phoneNumber" placeholder="+966..." pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required><br>

        <label>How Old Are You? </label><br>
        <input type="number" name="age" value="10" min="10" max="80"><br><br><br>

        <input type="submit" name="sign-in" value="Sign in"><br>
        </form>
    </body>
</html>
