<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gift Love</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Styling-Sheet.css">
  
    <style>#errorMsg { color: #eb6d6d; text-align: center; }  </style>
                                                                   
</head>
<body>

    <nav class="main-menu">
    <a href="HomePage.html" class="menu-button">Home</a>
    <a href="SignInPage.html" class="menu-button">Sign In</a>
    <a href="AboutUsPage.html" class="menu-button">About Us</a>
    </nav>

    <main>
        <section>
             <h1 style="text-align: center;">Log In</h1>
            <a href="AboutUsPage.html">
                <img id="logo" class="logo-pic" src="logo.png" alt="logo-png" >
            </a>
             <!--dont forget logo map-->

             <!--this is a java script validation code-->
             <form onsubmit="return validateLogin()"novalidate>

             <label for="email">Email</label>
             <input type="email" id="email" name="email" placeholder="example@email.com">
             <br>
             <label for="password">Password</label>
             <input type="password" id="password" name="password" placeholder="Enter your password">

             <!-- error message when validation fails -->
              <p id="errorMsg"></p>
             
             <button type="submit">Log in</button>
            
             </form>
           <p style="text-align: center;">Don't have an account? <a href="SignInPage.html">Sign up</a></p>
        </section>
    </main>

    <!--this is a java script validation code-->
    <script src="script.js"></script>
            <script>
                function changeLogo() {
                document.getElementById("logo").src = "logo-hover.png";
            }

            function resetLogo() {
                document.getElementById("logo").src = "logo.png";
            }
            var logo = document.getElementById("logo");
            logo.addEventListener("mouseover", changeLogo);
            logo.addEventListener("mouseout", resetLogo);
            </script>
   

</body>
</html>
